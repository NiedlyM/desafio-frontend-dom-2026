<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
    <title>Detalhes do livro | Pagina 42</title>
    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/home.css" />
    <link rel="stylesheet" href="./css/product.css" />
    <link rel="stylesheet" href="./css/cart.css" />
  </head>
  <body>
    <header class="header">
      <div class="container header__inner">
        <a class="brand" href="./index.html"><span>pagina</span> 42</a>
        <nav>
          <a href="./index.html#catalogo">Livros</a>
          <a href="./index.html#sobre">Sobre</a>
        </nav>
        <button
          class="cart-trigger"
          type="button"
          aria-label="Abrir carrinho"
          aria-expanded="false"
        >
          Carrinho
        </button>
      </div>
    </header>
    <main class="product-page">
      <div class="container">
        <a class="back-link" href="./index.html#catalogo">Voltar para o catalogo</a>
        <section class="book-detail" aria-live="polite"></section>
      </div>
    </main>
    <div class="cart-backdrop"></div>
    <aside class="cart" aria-label="Carrinho de compras" aria-hidden="true">
      <div class="cart__header">
        <div>
          <p class="eyebrow">sua sacola</p>
          <h2>Seu carrinho</h2>
        </div>
        <button class="cart__close" type="button" aria-label="Fechar carrinho">
          X
        </button>
      </div>
      <div class="cart__body">
        <div class="cart__products"></div>
      </div>
      <div class="cart__footer">
        <div class="cart__total">
          <span>Total</span><strong class="total">R$ 0,00</strong>
        </div>
        <button class="checkout" type="button">Finalizar compra</button>
      </div>
    </aside>
    <footer class="footer">
      <div class="container">
        <a class="brand" href="./index.html"><span>pagina</span> 42</a>
        <p>Livros para fazer companhia.</p>
        <small>Projeto de JavaScript e DOM</small>
      </div>
    </footer>
    <script src="./js/data.js"></script>
    <script src="./js/apoio.js"></script>
    <script src="./js/cart.js"></script>
    <script src="./js/checkout.js"></script>
    <script src="./js/product.js"></script>
  </body>
</html>
